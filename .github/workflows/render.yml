name: Render FG banners

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project ID (e.g. auto-lightbox) or all"
        required: true
        default: "all"
        type: string
      all_templates:
        description: "Render every template (banner + jed), not only the one set in projects.json"
        required: false
        default: false
        type: boolean

  push:
    paths:
      - "render.py"
      - "projects.json"
      - "requirements.txt"
      - "templates/**"
      - "assets/**"

concurrency:
  group: fg-banner-render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      # User-controlled input goes through env vars, never straight into the script body.
      - name: Select project
        id: selection
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROJECT: ${{ inputs.project_id }}
          INPUT_ALL_TEMPLATES: ${{ inputs.all_templates }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PROJECT="$INPUT_PROJECT"
          else
            PROJECT="all"
          fi

          PROJECT="$(echo "$PROJECT" | xargs)"
          [ -z "$PROJECT" ] && PROJECT="all"

          if ! printf '%s' "$PROJECT" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::Invalid project ID (allowed: letters, digits, - and _)"
            exit 1
          fi

          ARGS=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_ALL_TEMPLATES" = "true" ]; then
            ARGS="--all-templates"
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Rendering: $PROJECT $ARGS"

      - name: Validate project ID
        if: steps.selection.outputs.project != 'all'
        shell: bash
        env:
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |
          if ! python render.py list | awk '{print $1}' | grep -Fxq "$PROJECT"; then
            echo "::error::Unknown project ID: $PROJECT"
            echo
            echo "Available projects:"
            python render.py list
            exit 1
          fi

      # Fails the run on invalid config (e.g. a missing icon), output-file collisions
      # and any text that would be cut off or overflow the banner - before anything
      # is rendered or committed.
      - name: Check layout
        shell: bash
        env:
          PROJECT: ${{ steps.selection.outputs.project }}
          ARGS: ${{ steps.selection.outputs.args }}
        run: |
          if [ "$PROJECT" = "all" ]; then
            python render.py check $ARGS
          else
            python render.py check "$PROJECT" $ARGS
          fi

      - name: Diagnostic - before render
        shell: bash
        run: |
          echo "=== Projects ==="
          python render.py list
          echo
          echo "=== Output files before render ==="
          find output -type f -print -exec sha256sum {} \; 2>/dev/null || true

      - name: Render banner(s)
        shell: bash
        env:
          PROJECT: ${{ steps.selection.outputs.project }}
          ARGS: ${{ steps.selection.outputs.args }}
        run: |
          python render.py "$PROJECT" $ARGS

      - name: Diagnostic - after render
        shell: bash
        run: |
          echo "=== Output files after render ==="
          find output -type f -print -exec sha256sum {} \; 2>/dev/null || true
          echo
          echo "=== Git status after render ==="
          git status --short
          echo
          echo "=== Changed output files ==="
          git diff --name-status -- output/ || true

      - name: Stage generated output
        shell: bash
        run: |
          # -f guarantees that output files are staged even if an ignore rule
          # exists locally or is added later.
          git add -f output/

          echo "=== Staged changes ==="
          git diff --cached --name-status
          echo
          git diff --cached --stat

      - name: Commit generated output
        shell: bash
        env:
          PROJECT: ${{ steps.selection.outputs.project }}
        run: |
          if git diff --cached --quiet; then
            echo "No banner changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Render FG banner: ${PROJECT}"

          # Someone may have pushed while this job was running.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
