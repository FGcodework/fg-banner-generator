<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width={{ width }}, initial-scale=1"><title>FG {{ title }}</title><style>{{ css_text | safe }}</style><style>:root{--bg-top:{{ palette.background_top }};--bg-bottom:{{ palette.background_bottom }};--accent:{{ palette.accent }};--accent-2:{{ palette.accent_secondary }};--text:{{ palette.text_primary }};--muted:{{ palette.text_secondary }};--panel:{{ palette.panel_fill }};--panel-border:{{ palette.panel_border }};--glow:{{ palette.panel_glow }};--logo-size:{{ logo_size or ('100%' if logo_mode == 'full' else '77%') }};--logo-scale:{{ logo_scale if logo_scale is not none else 1 }};--logo-offset-x:{{ logo_offset_x if logo_offset_x is not none else 0 }}px;--logo-offset-y:{{ logo_offset_y if logo_offset_y is not none else 0 }}px;}</style></head><body>
<div class="banner"><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="rings"><span></span><span></span><span></span></div><div class="dots"></div>
<section class="left-panel"><div class="logo-shell"><div class="logo-inner">{% if logo_uri %}<img class="project-logo{% if logo_mode == 'full' %} project-logo-full{% endif %}" src="{{ logo_uri }}" alt="">{% else %}<div class="fallback-logo">{{ placeholder_logo or 'FG' }}</div>{% endif %}</div></div><div class="extension-type">{{ extension_type }}</div></section>
<section class="content"><header class="hero"><h1><span class="fg">{{ title_prefix }}</span><span>{{ title }}</span></h1><div class="subtitle">{{ subtitle }}</div><div class="divider"><i></i></div></header><div class="features features-{{ features|length }}">{% for f in features %}<article class="feature"><div class="feature-icon">{% include 'icons/' + f.icon + '.svg' %}</div><div class="feature-copy"><h2>{{ f.heading }}</h2><p>{{ f.description }}</p></div></article>{% endfor %}</div></section></div></body></html>
