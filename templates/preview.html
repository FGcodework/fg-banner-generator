<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FG Banner Generator v3.3 – Preview</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#07162b;color:#eef4ff}
main{width:min(1500px,calc(100% - 40px));margin:40px auto 80px}
p{color:#aebbd0}
h2{margin:48px 0 0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#8eacc5}
.grid{display:grid;gap:28px;margin-top:16px}
.card{border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.035);box-shadow:0 18px 48px rgba(0,0,0,.28)}
.card img{width:100%;display:block;aspect-ratio:16/7;object-fit:cover}
.meta{padding:14px 18px 18px}
.meta span{display:block;margin-top:4px;color:#aebbd0}
</style></head><body><main>
<h1>FG Banner Generator v3.3</h1>
<p>Jednotný HTML/CSS render bannerov v pomere 16:7.</p>
{% for g in groups %}
<h2>{{ g.name }}</h2>
<div class="grid">
{% for c in g.cards %}<article class="card"><img src="{{ c.src }}" alt="{{ c.title }}"><div class="meta"><strong>{{ c.title }}</strong><span>{{ c.subtitle }}</span></div></article>
{% endfor %}</div>
{% endfor %}
</main></body></html>
