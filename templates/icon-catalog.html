<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FG Banner Generator – Icon catalog</title>
<style>
body{font-family:system-ui,sans-serif;background:#07182f;color:#f5f8ff;margin:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#0c2b50;border:1px solid #24496f;border-radius:12px;padding:18px;text-align:center}
img{width:42px;height:42px;filter:brightness(0) invert(1)}
code{display:block;margin-top:10px;color:#b9c7de}
</style></head><body><h1>Tabler icon catalog</h1><div class="grid">
{% for name in icon_names %}<div class="card"><img src="{{ icon_base }}/{{ name }}.svg" alt=""><code>{{ name }}</code></div>{% endfor %}
</div></body></html>
